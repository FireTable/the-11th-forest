name: Iron Warden
hp: 420
moveSpeed: 2.5
body:
  halfW: 38
  halfH: 32
weaponId: rune-shield
sfx:
  hit: monster-hit
  death: monster-death
  aggro: monster-aggro
drops:
  - dropId: overcharge-core
    chance: 1.0
  - dropId: hp-shard
    chance: 0.8
  - dropId: ammo-cache
    chance: 0.6

sprite:
  texture: assets/image/monsters/warden.png
  grid: { rows: 4, cols: 4 }
  scale: 1.0
  offset: { left: 0, bottom: 0 }
  script:
    downsample: 4
    colors: 32
    pad: 2

anims:
  idle:
    frames: [0, 3]
    frameRate: 6
    repeat: -1
  move:
    frames: [4, 7]
    frameRate: 10
    repeat: -1
  hit:
    frames: [8, 11]
    frameRate: 12
    repeat: 0
  death:
    frames: [12, 14]
    frameRate: 10
    repeat: 0

prompt: |
    The 11th Forest — Iron Warden sprite sheet

    HARD NEGATIVE PROMPTS (must NOT appear in the image):
      - No visible grid, no dividers, no borders, no ground, no scene,
        no text, no logo, no watermark.
      - No grid lines, no cell borders, no cell separators, no dividers
        of any kind between the 4×4 frames.
      - No guide marks, no reference crosses, no axis labels, no frame
        numbers, no "Frame N" text, no index annotations.
      - No checkerboard pattern, no tile outline overlays, no debug
        visualizations.
      - No watermarks, no logos, no signatures, no UI elements.
      - The 4×4 layout is COMPLETELY IMPLIED by the character's position
        — the magenta background is one continuous flat field everywhere
        except where the character is drawn.

    CRITICAL LAYOUT (must be EXACTLY this — 16 cells, no more, no less,
    4 rows × 4 columns, every cell the same size):

      ┌────┬────┬────┬────┐
      │  0 │  1 │  2 │  3 │   row 1: idle (4 frames)
      ├────┼────┼────┼────┤
      │  4 │  5 │  6 │  7 │   row 2: move (4 frames)
      ├────┼────┼────┼────┤
      │  8 │  9 │ 10 │ 11 │   row 3: hit (4 frames)
      ├────┼────┼────┼────┤
      │ 12 │ 13 │ 14 │    │   row 4: death (3 frames; cell #15 empty)
      └────┴────┴────┴────┘

    The bottom-right cell (cell #15) MUST be empty magenta. Total:
    exactly 15 frames + 1 empty cell.

    Image size 2048×2048 (1:1), laid out as a 4×4 grid so each cell is
    512×512 px. The monster is ~420×500 px in each cell, centered
    horizontally. No overlapping between cells. The monster faces RIGHT in
    every frame (its front = screen right).

    Monster Concept (Iron Warden - Heavy Melee Miniboss):
    A massive iron-clad forest warden fused with ancient bronze plate
    armor, moss-rusted. Arms hang at sides, slightly forward, gauntlets
    relaxed. Single cyclops-style emerald eye in the center of the helmet.
    Built like a walking fortress. (The shield is added in-game as a separate
    orbiting weapon sprite; the monster sprite itself does NOT render it.)

    Same monster in every frame — armor, helmet, eye, body pose are
    identical. Only the pose/state changes.

    15 frames in row order (left-to-right, top-to-bottom), distributed as:

    Frames 0–3 (idle, 4 frames, row 1) — heavy breathing idle:
      Frame 0: Standing tall, weight evenly on both feet. Arms relaxed
               at sides. Helmet visor glowing emerald.
      Frame 1: Subtle inhale — chest rises slightly under armor. Moss
               on shoulders swaying.
      Frame 2: Slow shoulder roll, weight shifting to right foot. Helmet
               turning minutely. Visor pulses brighter then dims.
      Frame 3: Exhale — chest sinks. Returned to neutral stance.
               Heavy, immovable.

    Frames 4–7 (move, 4 frames, row 2) — heavy walk cycle:
      Frame 4: RIGHT foot planted forward, LEFT foot trailing back
               (extreme stride). Weight on right leg. Heavy step, ground
               cracks under right foot. Body leans back slightly. Arms
               swing naturally with the gait.
      Frame 5: Passing pose — LEFT foot lifting off the ground, both
               legs vertical. Heavy weight shift. Body upright.
      Frame 6: LEFT foot planted forward, RIGHT foot trailing back
               (extreme stride, opposite leg). Weight on left. New
               crack under left foot. Body leans back again. Arms
               swing naturally.
      Frame 7: Passing pose — RIGHT foot lifting, both legs vertical.
               Return to neutral.

    Frames 8–11 (hit, 4 frames, row 3) — stagger:
      Frame 8:  Initial stagger — body jolts back. Emerald eye flickers
               from green to orange.
      Frame 9:  Knocked further back-left. Helmet turns. Visor dims.
               One arm bent from recoil.
      Frame 10: Eye brightest orange. Armor plates rattle.
      Frame 11: Recovery — body upright again. Eye returning to green.
                Visor flickering.

    Frames 12–14 (death, 3 frames, row 4) — collapse:
      Frame 12: One knee buckles. Arms hang limp. Visor dimming.
      Frame 13: Armor plates burst outward. Emerald eye flickering
                rapidly. Body sagging.
      Frame 14: Armor piles up on ground. Emerald eye fully dark.
                Arms limp at sides. Collapsed.

    Style requirements:
    - High-end handcrafted 16-bit RPG aesthetic.
    - Inspired by Chrono Trigger, Eastward, Children of Morta, Hyper Light
      Drifter, and premium modern indie pixel games.
    - Hard clean pixel edges, no anti-aliasing on the silhouette.
    - Limited muted color palette: ~32 colors total per character.
    - No purple, magenta, or pink in the monster body itself.
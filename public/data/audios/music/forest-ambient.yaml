prompt: 'Calm iyashikei anime forest ambience, lo-fi peaceful soundtrack for magical forest exploration. Gentle fingerpicked acoustic guitar arpeggios, soft felt piano chords with light sustain, warm slow strings pad in the background, occasional flute or music box accents, very subtle nature field recording texture. Flat dynamic throughout — no crescendo, no climax, no build-up, no percussion, no drums, no dramatic swells. Consistent gentle volume like a perpetual breeze. Designed for seamless looping: the final chord resolves and decays back into the same motif as the opening. Studio Ghibli gentle exploration mood, not heroic, not melancholic, just serene and comforting. End on the same chord and melodic phrase as the beginning so the track loops seamlessly without audible edit point. Keep dynamics flat throughout.'

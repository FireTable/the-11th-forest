name: Laser Cannon
damage: 2
cooldownMs: 60
range: 700
clipSize: 50
reloadTimeMs: 2000
bulletsPerShot: 1
visual:
    texture: assets/image/weapons/laser-cannon.png
    scale: 0.16
    orbitRadius: 20
    anchor: [0.45, 0.5]
    recoilDistance: 4
    recoilDuration: 50
bullet:
    texture: assets/image/weapons/laser-beam-segment.png
    type: beam
    speed: 800
    # The laser-beam-segment PNG is 882px wide — at scale 0.16 the
    # rendered sprite is ~140px, longer than the bullet body's
    # radius. With a long sprite anchored on the body, half the beam
    # visibly sticks past the wall on the last frame before the body
    # is destroyed. Pin scale tight so the sprite matches the head
    # (≈ body radius) and the trail renderer carries the long-bar
    # look. Collision still happens at the body — that's the head.
    scale: 0.08
    anchor: [0.5, 0.5]
projectile:
    speed: 30
    visual:
        radius: 5
        width: 20
        height: 6
        color: 0xef4444
sfx:
    shoot: laser-cannon-shoot
    dryFire: dry-fire
    bulletWall: bullet-wall
    reloadStart: reload-start
    reloadFinish: reload-finish

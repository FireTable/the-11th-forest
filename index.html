<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/png" href="/favicon.png" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>The 11th Forest</title>

        <!-- Preload pixel font to prevent FOUT text flash -->
        <link rel="preload" href="/assets/font/press-start-2p-latin-400.woff2" as="font" type="font/woff2" crossorigin />

        <style>
            @font-face {
                font-family: 'Press Start 2P';
                font-style: normal;
                font-weight: 400;
                font-display: block;
                src: url('/assets/font/press-start-2p-latin-400.woff2') format('woff2');
            }

            /* ALL styles strictly scoped inside #boot container to prevent polluting global/React styles */
            #boot, #boot * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            #boot {
                position: fixed;
                inset: 0;
                z-index: 9999;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 20px;
                background: #030508;
                font-family: 'Press Start 2P', monospace;
                user-select: none;
                transition: opacity 0.45s cubic-bezier(0.4, 0, 0.2, 1);
                overflow: hidden;
            }

            #boot.boot-done {
                opacity: 0;
                pointer-events: none;
            }

            /* Ambient Forest Artwork Background */
            #boot .forest-bg {
                position: absolute;
                inset: 0;
                width: 100%;
                height: 100%;
                object-fit: cover;
                opacity: 0.45;
                filter: contrast(1.15) brightness(0.9);
                pointer-events: none;
                z-index: 1;
            }

            #boot .forest-overlay {
                position: absolute;
                inset: 0;
                background: 
                    radial-gradient(circle at 50% 40%, rgba(6, 182, 212, 0.12) 0%, transparent 60%),
                    radial-gradient(circle at 50% 80%, rgba(3, 5, 8, 0.3) 0%, #030508 85%);
                z-index: 2;
                pointer-events: none;
            }

            /* Ambient Particles */
            #boot .particles-container {
                position: absolute;
                inset: 0;
                z-index: 3;
                pointer-events: none;
            }
            #boot .spore {
                position: absolute;
                bottom: -20px;
                width: 3px;
                height: 3px;
                background: #71f6fd;
                box-shadow: 0 0 6px #71f6fd;
                opacity: 0;
                animation: boot-spore-float 6.5s infinite linear;
            }
            #boot .spore.rose {
                background: #f43f5e;
                box-shadow: 0 0 6px #f43f5e;
                width: 5px;
                height: 3px;
            }

            @keyframes boot-spore-float {
                0% { transform: translateY(0) rotate(0deg); opacity: 0; }
                15% { opacity: 0.85; }
                85% { opacity: 0.75; }
                100% { transform: translateY(-110vh) rotate(270deg); opacity: 0; }
            }

            /* Main Content Container */
            #boot .boot-content {
                position: relative;
                z-index: 10;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 20px;
                width: min(88vw, 460px);
            }

            /* Header Section */
            #boot .title-wrap {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 8px;
                min-height: 52px;
            }

            #boot h1 {
                font-size: clamp(16px, 3.5vw, 24px);
                line-height: 1.3;
                letter-spacing: 0.14em;
                color: #71f6fd;
                text-shadow: 0 0 16px rgba(6, 182, 212, 0.7), 2px 2px 0px #020d12;
                text-align: center;
                white-space: nowrap;
            }

            #boot .tagline {
                font-size: clamp(7px, 1.2vw, 9px);
                line-height: 1.2;
                letter-spacing: 0.2em;
                color: #06b6d4;
                text-shadow: 0 0 8px rgba(6, 182, 212, 0.4);
                text-transform: uppercase;
                text-align: center;
                white-space: nowrap;
            }

            /* Path & Character Progress Component */
            #boot .progress-wrapper {
                position: relative;
                width: 100%;
                display: flex;
                flex-direction: column;
                gap: 4px;
            }

            /* Character Movement Track */
            #boot .runner-track {
                position: relative;
                width: 100%;
                height: 36px;
            }

            /* Moving Pixel Character */
            #boot .pixel-runner {
                position: absolute;
                bottom: 0;
                left: 0%;
                transform: translateX(-50%);
                width: 28px;
                height: 34px;
                z-index: 15;
                animation: boot-runner-move 10s cubic-bezier(0.22, 0.61, 0.36, 1) forwards;
            }
            #boot.boot-done .pixel-runner {
                animation: none;
                left: 100%;
                transition: left 0.3s ease-out;
            }

            #boot .pixel-runner svg {
                width: 28px;
                height: 34px;
                shape-rendering: crispEdges;
                animation: boot-runner-bob 0.35s steps(2) infinite;
            }

            @keyframes boot-runner-bob {
                0% { transform: translateY(0px); }
                50% { transform: translateY(-3px); }
            }

            @keyframes boot-runner-move {
                0% { left: 0%; }
                100% { left: 92%; }
            }

            /* Progress Bar Track */
            #boot .progress-bar {
                position: relative;
                width: 100%;
                height: 18px;
                background: #04080e;
                border: 2px solid #16363e;
                box-shadow: inset 1px 1px 4px rgba(0, 0, 0, 0.9);
                overflow: hidden;
            }

            #boot .progress-bar::after {
                content: '';
                position: absolute;
                top: 1px;
                bottom: 1px;
                left: 1px;
                right: 1px;
                background: linear-gradient(90deg, #0284c7 0%, #06b6d4 60%, #71f6fd 100%);
                box-shadow: 0 0 12px rgba(6, 182, 212, 0.85);
                transform-origin: left center;
                transform: scaleX(0);
                animation: boot-bar-fill 10s cubic-bezier(0.22, 0.61, 0.36, 1) forwards;
            }
            #boot.boot-done .progress-bar::after {
                animation: none;
                transform: scaleX(1);
                transition: transform 0.3s ease-out;
            }

            /* Status Text */
            #boot .status-text {
                font-size: clamp(8px, 1.4vw, 10px);
                line-height: 1.4;
                letter-spacing: 0.18em;
                color: #4b7478;
                text-align: center;
                min-height: 14px;
                white-space: nowrap;
                animation: boot-status-pulse 2.2s ease-in-out infinite alternate;
            }

            @keyframes boot-bar-fill {
                to { transform: scaleX(0.92); }
            }
            @keyframes boot-status-pulse {
                from { opacity: 0.4; }
                to { opacity: 1; color: #67e8f9; text-shadow: 0 0 8px rgba(103, 232, 249, 0.5); }
            }

            @media (prefers-reduced-motion: reduce) {
                #boot .pixel-runner { animation: none; }
                #boot .status-text { animation: none; }
            }
        </style>
    </head>

    <body>
        <div id="boot">
            <!-- Atmospheric Forest SVG Background -->
            <img src="/assets/image/ui/forest-loading-art.svg" class="forest-bg" width="320" height="180" alt="" aria-hidden="true" />
            <div class="forest-overlay"></div>

            <!-- Ambient Particles -->
            <div class="particles-container">
                <div class="spore" style="left: 15%; animation-delay: 0s; animation-duration: 6s;"></div>
                <div class="spore rose" style="left: 32%; animation-delay: 1.5s; animation-duration: 7.5s;"></div>
                <div class="spore" style="left: 55%; animation-delay: 0.8s; animation-duration: 5.8s;"></div>
                <div class="spore rose" style="left: 72%; animation-delay: 2.2s; animation-duration: 8s;"></div>
                <div class="spore" style="left: 88%; animation-delay: 1.1s; animation-duration: 6.2s;"></div>
            </div>

            <!-- Central Content Container -->
            <div class="boot-content">
                <div class="title-wrap">
                    <h1>THE 11TH FOREST</h1>
                    <div class="tagline">Gothic Pixel Action Shooter</div>
                </div>

                <div class="progress-wrapper">
                    <!-- Runner Track -->
                    <div class="runner-track">
                        <div class="pixel-runner">
                            <svg viewBox="0 0 14 17" width="28" height="34" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M4 1h6v3H4zM3 3h8v2H3z" fill="#0f2b30"/>
                                <path d="M4 5h6v3H4z" fill="#ffdbac"/>
                                <rect x="5" y="6" width="1" height="1" fill="#0f172a"/>
                                <rect x="8" y="6" width="1" height="1" fill="#0f172a"/>
                                <path d="M3 8h8v5H3z" fill="#06b6d4"/>
                                <path d="M2 9h2v4H2z" fill="#0284c7"/>
                                <path d="M4 8h6v1H4z" fill="#e11d48"/>
                                <rect x="4" y="13" width="2" height="3" fill="#1e293b"/>
                                <rect x="8" y="13" width="2" height="3" fill="#1e293b"/>
                            </svg>
                        </div>
                    </div>

                    <!-- Progress Bar Track -->
                    <div class="forest-path">
                        <div class="progress-bar"></div>
                    </div>
                </div>

                <p class="status-text">LOADING THE FOREST...</p>
            </div>
        </div>

        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
